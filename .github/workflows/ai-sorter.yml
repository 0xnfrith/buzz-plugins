# The AI sorter (.github/sorter/README.md). Claude Haiku reads each pull request's change and answers one question: does it touch the
# owner's sensitive list (.github/sorter/list.md)? "No" passes. "Yes" fails until the owner approves the pull request's latest commit.
# It fails closed: a missing key, an API error, a spent cap or an answer that is not the exact JSON fails the check too.
#
# Built to be a required check, so: no `paths` filter and no job-level `if` (a required check must report on every pull request, and a
# job skipped by a condition reports success). All branching is in the script.
#
# Security:
# - `pull_request`, never `pull_request_target`. The key is only in the last step.
# - Nothing from the pull request is ever run. The pull request is checked out into pr/ as data. The sorter runs from the base branch's
#   copy of .github/sorter in trusted/, beside pr/ and never inside it, so no file of the pull request (a tsconfig.json, jsconfig.json
#   or package.json at its root, say) sits in any folder that Bun looks through.
# - The model is asked once per change; edits, reviews and re-runs reuse the verdict recorded for exactly that change (the README says
#   how), and fail closed when there is none.
# - Pull requests from forks get no secrets and fail closed unless the owner approves their latest commit.
# - This file itself comes from the pull request under `pull_request`; since 2026-11-11 CODEOWNERS lists only itself, so nothing but review guards it (see the README's limits).
name: AI sorter

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The owner's approval (or its dismissal) runs the check again, on the same commit.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  # To read the verdict recorded on earlier check runs of this commit, and to check which workflow run recorded it.
  checks: read
  actions: read

# One run at a time per commit. A run waiting in a group is cancelled when another one queues, so the group is the commit: the run that
# asks the model is always the first for its commit and never waits, and only runs that would reuse its verdict can be cancelled.
concurrency:
  group: ai-sorter-${{ github.event.pull_request.head.sha }}

jobs:
  sort:
    # The check's name. Keep it: a ruleset requires it by this name, and the recorded verdicts are looked up by it.
    name: AI sorter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The pull request (data only, never run)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pr
          persist-credentials: false
          # The merge commit GitHub made for the pull request, and its two parents.
          fetch-depth: 2
      - name: The sorter, from the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: /.github/sorter/
          sparse-checkout-cone-mode: false
      # One exact build of Bun, downloaded, never restored from the Actions cache: a pull request's run (a fork's too) can save to the
      # cache scope its later runs restore from first, and setup-bun checks a cached binary only by asking it its version. Nothing else
      # here restores a cache: no actions/cache, a GitHub-hosted job starts with an empty Bun install cache, and `bun install` checks
      # each package against the integrity hash in the base branch's bun.lock.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          no-cache: true
      - name: Bun is the pinned build
        # The sha256 of the bun binary in bun-v1.4.4's bun-linux-x64.zip (the zip matches the release's SHASUMS256.txt).
        env:
          BUN_SHA256: 10702245766b225e70bbf6235fd6b47214fd94b4760d00ffaed8ab0df57ac235
        run: echo "$BUN_SHA256  $(command -v bun)" | sha256sum --check --strict
      - name: Install (frozen lockfile, no install scripts)
        working-directory: trusted/.github/sorter
        run: bun install --frozen-lockfile --ignore-scripts
      - name: The pull request's change
        working-directory: trusted/.github/sorter
        env:
          SORTER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./change.sh "$GITHUB_WORKSPACE/pr" "$SORTER_HEAD_SHA" "$RUNNER_TEMP"
      - name: Sort
        working-directory: trusted/.github/sorter
        env:
          SORTER_ANTHROPIC_API_KEY: ${{ secrets.SORTER_ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SORTER_PR_NUMBER: ${{ github.event.pull_request.number }}
          SORTER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SORTER_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SORTER_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SORTER_EVENT: ${{ github.event_name }}
          SORTER_ACTION: ${{ github.event.action }}
          SORTER_RUN_ATTEMPT: ${{ github.run_attempt }}
          # Whose approval of the latest commit clears the check: the repository's owner, written here and not read from a setting.
          SORTER_APPROVERS: 0xnfrith
          SORTER_DIFF_FILE: ${{ runner.temp }}/change.diff
          SORTER_NUMSTAT_FILE: ${{ runner.temp }}/change.numstat
        run: bun sorter.ts
