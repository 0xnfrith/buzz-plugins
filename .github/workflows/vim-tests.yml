# The functional tests of the Vim mode plugin (plugins/vim/test/vim.spec.mjs): every key, mode and surface, in headless Chromium
# against block/buzz-app's own production web build, the way plugins/vim/test/run.sh runs them by hand. The key-latency budget is
# a separate workflow (vim-latency.yml).
#
# Both suites load the committed plugins/vim/plugin.js, not src/, so the `build` job checks that the committed file is the build of
# src/: without it, a change to src/ alone would be tested as the old plugin.js. The functional tests run after it, and not when it fails.
name: Vim functional tests

on:
  # Called by tests.yml, which runs on every pull request to main, every push to main and every merge group, and calls this
  # workflow when its plugin changes (or anything under .github/). Its `all-tests` check is the one to require. Run by hand from the
  # Actions tab with workflow_dispatch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The block/buzz-app commit the plugin is tested against (plugins/vim/NOTES.md, "What was and was not verified").
  # The other workflows that build the app name the same commit: the first step of each of them fails when any two differ.
  BUZZ_APP_REF: d92bfb2c4dd89fc5ae6e7a1445f38ad1e8ab7060

jobs:
  build:
    name: Vim type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/vim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc
      - name: plugin.js is the build of the source
        # Buzz loads the committed plugin.js and never runs a build: it has to be what this source builds to. The file is removed
        # first, so a build that does not write it (a changed output name, a build script that does nothing) leaves it missing, and
        # `git status` also catches a plugin.js that is missing from the commit or not tracked at all.
        run: |
          rm -f plugin.js
          pnpm run build
          if [ -n "$(git status --porcelain -- plugin.js)" ]; then
            git status --short -- plugin.js
            git diff -- plugin.js
            echo "::error::plugin.js is not the build of src/: run 'pnpm run build' in plugins/vim and commit it"
            exit 1
          fi

  functional:
    name: Vim functional tests
    # A stale bundle fails `build` in about a minute; the functional tests would only test the old plugin.js, so they wait for it.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a run takes about 11 minutes, setup included
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: BUZZ_APP_REF is defined, and the same, in every workflow that builds the app
        run: .github/check-app-ref.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Functional tests
        run: plugins/vim/test/run.sh buzz-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: vim-functional-test-results
          path: buzz-app/test-results
          if-no-files-found: ignore
          retention-days: 14
