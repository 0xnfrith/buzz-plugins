# The functional tests of the Vim mode plugin (plugins/vim/test/vim.spec.mjs): every key, mode and surface, in headless Chromium
# against block/buzz-app's own production web build, the way plugins/vim/test/run.sh runs them by hand. The key-latency budget is
# a separate workflow (vim-latency.yml).
name: Vim functional tests

on:
  pull_request:
    paths:
      - "plugins/vim/**"
      - ".github/workflows/vim-tests.yml"
  push:
    branches: [main]
    paths:
      - "plugins/vim/**"
      - ".github/workflows/vim-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vim-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The block/buzz-app commit the plugin is tested against (plugins/vim/NOTES.md, "What was and was not verified").
  # vim-latency.yml names the same commit: change both together.
  BUZZ_APP_REF: d92bfb2c4dd89fc5ae6e7a1445f38ad1e8ab7060

jobs:
  functional:
    name: Vim functional tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a run takes about 11 minutes, setup included
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: BUZZ_APP_REF is the same in both Vim workflows
        run: |
          ref() { sed -n 's/^  BUZZ_APP_REF: \([0-9a-f]\{40\}\).*/\1/p' "$1"; }
          [ -n "$(ref .github/workflows/vim-latency.yml)" ] && [ "$(ref .github/workflows/vim-latency.yml)" = "$(ref .github/workflows/vim-tests.yml)" ] \
            || { echo "::error::BUZZ_APP_REF is not the same 40-character commit in vim-latency.yml and vim-tests.yml: change both together"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Functional tests
        run: plugins/vim/test/run.sh buzz-app -g "Esc leaves visual mode with the caret on the cursor" --repeat-each=100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: vim-functional-test-results
          path: buzz-app/test-results
          if-no-files-found: ignore
          retention-days: 14
