# Type check, unit tests and build check of the GHOST Protocol plugin (plugins/ghost-protocol/test/unit), the node tests of its fake
# `docker` (plugins/ghost-protocol/test/fake-docker, on Linux and on macOS), and its browser suite (plugins/ghost-protocol/test/web) in
# headless Chromium against block/buzz-app's own production web build, the way plugins/ghost-protocol/test/run.sh runs it by hand.
#
# What the browser suite cannot cover: the web build has no `ctx.host.spawn` (it throws "Processes require an installed desktop plugin"),
# so the suite replaces it with a stub. The page's own check of Docker scripts what `docker version` prints and how it exits; the status
# screen's spec hands every call to the fake `docker` (plugins/ghost-protocol/test/fake-docker), which runs in Node, so what the plugin reads
# is what the fake printed. Together they prove the page, the one screen for each way a command can end and for each state of the status,
# and that the plugin asks the host for the declared process and nothing else. They do not run a real `docker` or GHOST Protocol, and they
# register the plugin from a fixture, so they do not run the Git importer, the loader or the install review. The `install` job does: it adds
# the plugin through Buzz's own "Add a plugin" dialog (plugins/ghost-protocol/test/install), with Buzz's `buzzodz-plugins` crate behind the
# plugin commands, and holds the review, the start-up and the page's place in Search and the sidebar to the committed manifest.json. Neither
# is a run in the desktop app, which is not built yet (AGENTS.md), and the plugin's first real check is a run on a real Mac.
name: GHOST Protocol tests

on:
  # Called by tests.yml, which runs on every pull request to main, every push to main and every merge group, and calls this
  # workflow when its plugin changes (or anything under .github/). Its `all-tests` check is the one to require. Run by hand from the
  # Actions tab with workflow_dispatch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The block/buzz-app commit the plugin is tested against. The other workflows that build the app name the same commit: the first step
  # of each of them (.github/check-app-ref.sh) fails when any two differ, or when one uses it without defining it, so change them together.
  BUZZ_APP_REF: 51d63954c074e94497dc030b54a204d34b7471be

jobs:
  test:
    name: GHOST Protocol type check, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/ghost-protocol
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc
      - name: Unit tests
        # A run that finds no tests passes too, so the machine-readable result says it: some tests ran, every one passed, none was skipped.
        run: |
          pnpm exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/unit.json"
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numFailedTests == 0 and .numPendingTests == 0' "$RUNNER_TEMP/unit.json"
          jq '{tests: .numTotalTests, passed: .numPassedTests, failed: .numFailedTests, skipped: .numPendingTests}' "$RUNNER_TEMP/unit.json"
      - name: Fake docker tests
        # The fake `docker` the plugin's later tests put first on the PATH has node:test files and needs no install. The script runs them
        # once the folder exists. From then on it fails when the folder has no *.test.mjs file (`node --test` with a glob that matches
        # nothing exits 0), and when a test fails or is skipped, so they cannot stop running quietly. Its own tests are in the unit tests.
        working-directory: .
        run: plugins/ghost-protocol/test/fake-docker-tests.sh
      - name: plugin.js is the build of the source
        # Buzz loads the committed plugin.js and never runs a build: it has to be what this source builds to. The file is removed
        # first, so a build that does not write it (a changed output name, a build script that does nothing) leaves it missing, and
        # `git status` also catches a plugin.js that is missing from the commit, not tracked or ignored. The status is its own command,
        # so a git error fails the step.
        run: |
          rm -f plugin.js
          pnpm run build
          status=$(git status --porcelain --ignored -- plugin.js)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- plugin.js
            echo "::error::plugin.js is not the build of src/: run 'pnpm run build' in plugins/ghost-protocol and commit it"
            exit 1
          fi

  fake-docker-macos:
    # The fake `docker` runs on Linux and on macOS CI (it is a node script). This is the repository's only macOS job; it runs the same
    # node:test files as the step above (the same script), on a Mac, and has nothing to run until plugins/ghost-protocol/test/fake-docker exists.
    name: GHOST Protocol fake docker tests (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Fake docker tests
        # The same script as the Linux job runs, and the same guards.
        run: plugins/ghost-protocol/test/fake-docker-tests.sh

  browser:
    # plugins/ghost-protocol/test/web/ghost-protocol.spec.mjs, status-screen.spec.mjs and screenshots.spec.mjs in headless Chromium against
    # block/buzz-app's own production web build, at BUZZ_APP_REF. test/run.sh copies the committed plugin, a wrapper that points the host's
    # `spawn` at a stub, and the specs into the app checkout; the second spec runs the fake `docker` from this folder (GHOST_PROTOCOL_DIR) in
    # Node; the third makes the README's pictures into a scratch folder and checks them against the committed ones in screenshots/ (a
    # PNG each, small, the same set, though not the same pixels: they differ from one machine to the next). No real docker, network, key or
    # token is used.
    name: GHOST Protocol browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # the tests take a few minutes; the set-up is most of it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: BUZZ_APP_REF is defined, and the same, in every workflow that builds the app
        run: .github/check-app-ref.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        # The committed plugin.js is what the suite loads. The unit job above checks that it is the build of the source.
        run: plugins/ghost-protocol/test/run.sh buzz-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ghost-protocol-browser-test-results
          path: buzz-app/test-results
          if-no-files-found: ignore
          retention-days: 14

  install:
    # plugins/ghost-protocol/test/install: the plugin installed the way a person does, not registered from a fixture. In Buzz's own
    # production web build (headless Chromium, at BUZZ_APP_REF), Settings -> Manage plugins -> Add reads this repository on GitHub with the
    # Git importer of Buzz's `buzzodz-plugins` crate (built here from the same checkout of block/buzz-app; plugins/ghost-protocol/test/install/
    # bridge.rs only passes the browser's plugin commands to it), the review is held to manifest.json, Buzz's own loader starts the plugin, and
    # its page must be in Search and in the Messages sidebar's page block. Then the same check runs on copies of the plugin that are broken one
    # way each, and the job fails unless every one of them fails where it should (breaks.sh). It reads GitHub, so it needs the network: an error
    # that says it could not reach GitHub fails the job, after one more try of the clone, and is never skipped.
    #
    # What it cannot cover: the desktop app itself (the Tauri window and commands of src-tauri, macOS, signature enforcement, the managed
    # plugin policy), and anything the plugin does through the host (`ctx.host.spawn`, `runCommand`), because the page is never opened here.
    name: GHOST Protocol install check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit the importer will read from GitHub: a pull request's own head, not GitHub's merge of it with main. The spec, the bridge
          # and the manifest the review is held to then all come from the commit the plugin is installed from. A commit id, not text a
          # person wrote, so it is safe here.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Which branch the importer reads
        id: source
        # The branch names reach the script only through the environment, quoted, never as text in the script.
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_QUEUE_BRANCH: ${{ github.event.merge_group.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            pull_request)
              # The importer reads a branch of this repository on GitHub; a fork's branch is not there.
              if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                echo "::error::This pull request comes from $HEAD_REPOSITORY. The install check reads the head commit from $GITHUB_REPOSITORY on GitHub, so a fork's head is not supported: open the pull request from a branch of this repository."
                exit 1
              fi
              branch=$PULL_REQUEST_BRANCH ;;
            merge_group) branch=${MERGE_QUEUE_BRANCH#refs/heads/} ;;
            *) branch=$REF_NAME ;;
          esac
          echo "reference=$branch" >>"$GITHUB_OUTPUT"
      - name: BUZZ_APP_REF is defined, and the same, in every workflow that builds the app
        run: .github/check-app-ref.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Rust toolchain, the one the app pins, without its extra components
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' buzz-app/rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::buzz-app/rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: buzz-app
          key: ghost-protocol-install
          # Only a push to main saves the cache; a pull request restores it.
          save-if: ${{ github.event_name == 'push' }}
      - name: Install check, from GitHub
        env:
          INSTALL_REFERENCE: ${{ steps.source.outputs.reference }}
        run: plugins/ghost-protocol/test/install/run.sh buzz-app
      - name: Install check on broken copies of the plugin
        # Runs whether or not the step above did: it reads a folder on disk, not GitHub, and its answer does not depend on it.
        if: ${{ !cancelled() }}
        env:
          INSTALL_ARTIFACTS: ${{ runner.temp }}/install-check-results
        run: plugins/ghost-protocol/test/install/breaks.sh buzz-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ghost-protocol-install-check-results
          path: |
            buzz-app/test-results
            ${{ runner.temp }}/install-check-results
          if-no-files-found: ignore
          retention-days: 14
