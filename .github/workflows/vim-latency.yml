# The key-latency budget of the Vim mode plugin (plugins/vim/test/budget.spec.mjs): the time from a key press to the next
# painted frame, on every surface, in headless Chromium against block/buzz-app's own production web build. A row fails its job
# when its p99 is over 50 ms in all three attempts; the p95 target (16 ms) is reported in the job summary (the spec writes the
# table to $GITHUB_STEP_SUMMARY), not enforced.
#
# The tests are run in shards, one job per surface, so that one slow runner cannot fail the gate on its own and the wait is the
# longest surface rather than the sum of them. The shards are told apart by the titles of the spec's tests (`--grep`), so the spec
# and the scripts under plugins/vim/test do not change for it. They are listed in one place, the `shards` step of the `plan` job,
# which also checks, before anything is measured, that between them they run every test of the spec exactly once. "rest" is
# everything the other shards do not name, so a test added later always lands somewhere. The final job, "Key latency budget", is the
# one check to require: it fails unless the plan and every shard passed.
name: Vim key latency

on:
  pull_request:
    paths:
      - "plugins/vim/**"
      - ".github/workflows/vim-latency.yml"
  push:
    branches: [main]
    paths:
      - "plugins/vim/**"
      - ".github/workflows/vim-latency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vim-latency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The block/buzz-app commit the plugin is tested against (plugins/vim/NOTES.md, "What was and was not verified").
  # The other workflows that build the app name the same commit: the first step of each of them fails when any two differ.
  BUZZ_APP_REF: d92bfb2c4dd89fc5ae6e7a1445f38ad1e8ab7060

jobs:
  plan:
    name: Plan the latency shards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: BUZZ_APP_REF is the same in every workflow that builds the app
        run: |
          # Every workflow file that names a BUZZ_APP_REF must name the same 40-character commit.
          lines=$(grep -h -E '^  BUZZ_APP_REF:' .github/workflows/*.yml)
          [ "$(grep -c -E '^  BUZZ_APP_REF: [0-9a-f]{40}( .*)?$' <<<"$lines")" = "$(grep -c . <<<"$lines")" ] \
            && [ "$(sed -E 's/^  BUZZ_APP_REF: ([0-9a-f]{40}).*/\1/' <<<"$lines" | sort -u | wc -l)" = 1 ] \
            || { echo "::error::BUZZ_APP_REF is not the same 40-character commit in every workflow that names it: change them together"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: The shards
        id: shards
        # `timeout` is in minutes: about twice the longest a shard has taken on a runner, setup included (message list 15, the others 4 to 6).
        # `grep` picks a shard's tests by title (a regular expression); "budget: the table" is in every one, because the table of a
        # shard's rows and its summary are written by that test. `invert` leaves tests out. "rest" names none and leaves out the others.
        run: |
          shards=$(jq -c . <<'JSON'
          [
            {"id": "channel-list", "name": "channel list", "grep": "budget: (channel list|the table$)", "invert": "", "timeout": 20},
            {"id": "message-list", "name": "message list", "grep": "budget: (message list \\(|the table$)", "invert": "", "timeout": 35},
            {"id": "thread-pane", "name": "thread pane", "grep": "budget: (thread pane|the table$)", "invert": "", "timeout": 20},
            {"id": "settings", "name": "Settings", "grep": "budget: (Settings dialog|the table$)", "invert": "", "timeout": 20},
            {"id": "rest", "name": "rest", "grep": "", "invert": "budget: (channel list|message list \\(|thread pane|Settings dialog)", "timeout": 20}
          ]
          JSON
          )
          echo "json=$shards" >> "$GITHUB_OUTPUT"
      - name: Every test runs in exactly one shard
        env:
          SHARDS: ${{ steps.shards.outputs.json }}
        run: |
          set -euo pipefail
          table='budget: the table'
          fail() { echo "::error::$1"; echo "**Not planned:** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # The test titles Playwright would run for these arguments, without the file, line and project.
          list() {
            local out
            out=$(plugins/vim/test/budget.sh buzz-app --list "$@" 2>"$RUNNER_TEMP/list.err") || { cat "$RUNNER_TEMP/list.err"; fail "listing the tests failed"; }
            sed -n -E 's/^ +\[[^]]*\] › [^ ]+ › //p' <<<"$out"
          }
          without_table() { grep -v -x -F "$table" || true; }
          all=$(list | without_table | LC_ALL=C sort)
          [ -n "$all" ] || fail "the spec lists no tests"
          { echo "### Latency shards"; echo; echo "The spec lists $(wc -l <<<"$all") tests."; echo; echo "| Shard | Tests |"; echo "| --- | ---: |"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$(jq -r '[.[].id] | length - (unique | length)' <<<"$SHARDS")" = 0 ] || fail "two shards have the same id"
          union=""
          while IFS= read -r shard; do
            id=$(jq -r .id <<<"$shard"); g=$(jq -r .grep <<<"$shard"); inv=$(jq -r .invert <<<"$shard")
            args=()
            [ -z "$g" ] || args+=(--grep "$g")
            [ -z "$inv" ] || args+=(--grep-invert "$inv")
            mine=$(list "${args[@]}")
            [ "$(grep -c -x -F "$table" <<<"$mine" || true)" = 1 ] || fail "shard $id does not run the table test exactly once, so it would write no table"
            mine=$(without_table <<<"$mine" | LC_ALL=C sort)
            [ -n "$mine" ] || fail "shard $id has no tests"
            echo "| $id | $(wc -l <<<"$mine") |" >> "$GITHUB_STEP_SUMMARY"
            union+="$mine"$'\n'
          done < <(jq -c '.[]' <<<"$SHARDS")
          union=$(printf '%s' "$union" | LC_ALL=C sort)
          if [ "$union" != "$all" ]; then
            echo "Tests in no shard (<) or in more than one (>):"
            diff <(printf '%s\n' "$all") <(printf '%s\n' "$union") || true
            fail "the shards together are not exactly the tests of the spec: see the log for which"
          fi
          echo "All $(wc -l <<<"$all") tests are in exactly one shard."

  shard:
    name: Key latency (${{ matrix.shard.name }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.shard.timeout }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Key latency budget (${{ matrix.shard.name }})
        env:
          BUDGET_OUT: ${{ runner.temp }}/vim-budget
          SHARD_GREP: ${{ matrix.shard.grep }}
          SHARD_INVERT: ${{ matrix.shard.invert }}
        run: |
          args=()
          [ -z "$SHARD_GREP" ] || args+=(--grep "$SHARD_GREP")
          [ -z "$SHARD_INVERT" ] || args+=(--grep-invert "$SHARD_INVERT")
          plugins/vim/test/budget.sh buzz-app "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vim-key-latency-${{ matrix.shard.id }}
          path: |
            ${{ runner.temp }}/vim-budget.md
            ${{ runner.temp }}/vim-budget.json
          retention-days: 14

  budget:
    # The one check to require. A shard that fails, is cancelled or never ran (the plan failed) turns it red.
    name: Key latency budget
    needs: [plan, shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          [ "$PLAN" = success ] && [ "$SHARDS" = success ]
