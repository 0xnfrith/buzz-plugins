# Every plugin test workflow, called from one place, and one check over all of them: `all-tests`, the check to require.
#
# GitHub blocks a merge only on a required check, and a required check that never reports leaves the pull request waiting. So this
# workflow runs on every pull request to main, every push to main and every merge group, and the plugin test workflows have no
# events of their own: they are called from here (`workflow_call`), each one once, and only when the change touches its plugin.
# The `changes` job decides which, with .github/tests-to-run.sh, which holds the list (one row per test workflow, and the plugins that
# have no tests on purpose). A change that touches none of their files (CONTRIBUTING.md, say) calls none of them, so `all-tests` passes as
# soon as the list of changed files is made. The `plugin-assets` row is broad on purpose: it reads every plugin folder, so a change
# to plugins/, assets/, docs/ or the top README.md calls it. A change to any file under .github/ calls every one, and so does running
# this workflow by hand.
# `all-tests` waits for all of them and fails unless the list was made and each test workflow did what the list said: passed when
# it was called, was skipped when it was not.
#
# To add a plugin's tests, give its workflow `on: workflow_call` and put its name in five places: its row in .github/tests-to-run.sh,
# the list of rows (ROWS) in .github/tests-to-run.test.mjs, the `outputs` of the `changes` job, a job below that calls the workflow,
# and the `needs` of `all-tests`. If one of these is missing, `changes` or `all-tests` fails and says so.
name: Tests

on:
  pull_request:
    branches: [main]
    # Only pull requests into main, so no `all-tests` result comes from a run against another base. No `edited`: an edit of the title
    # or description would run the tests again and cancel the run in progress. A pull request whose base is changed to main has no
    # `all-tests` result from this workflow at all, so it waits for its next push: a missing required check blocks the merge.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer run (a newer push) cancels the one it replaces. Any other run (a push to main, a merge group, a run by
  # hand) is grouped by its own commit, so it never waits for, or is replaced by, the run of another commit.
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Which plugin tests apply
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.match.outputs.rows }}
      after-merge: ${{ steps.match.outputs.after-merge }}
      agent-skills-highlighter: ${{ steps.match.outputs.agent-skills-highlighter }}
      agent-stats: ${{ steps.match.outputs.agent-stats }}
      ai-sorter: ${{ steps.match.outputs.ai-sorter }}
      artifacts: ${{ steps.match.outputs.artifacts }}
      artifacts-browser: ${{ steps.match.outputs.artifacts-browser }}
      beeper: ${{ steps.match.outputs.beeper }}
      linear: ${{ steps.match.outputs.linear }}
      megatech-support: ${{ steps.match.outputs.megatech-support }}
      megatech-support-browser: ${{ steps.match.outputs.megatech-support-browser }}
      merge-by-policy: ${{ steps.match.outputs.merge-by-policy }}
      plugin-assets: ${{ steps.match.outputs.plugin-assets }}
      vim-tests: ${{ steps.match.outputs.vim-tests }}
      vim-latency: ${{ steps.match.outputs.vim-latency }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, so the base of the change is there to diff against
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The test of the script that picks the tests
        run: node --test .github/tests-to-run.test.mjs
      - name: The changed files, and the tests they call
        id: match
        env:
          EVENT: ${{ github.event_name }}
          # A pull request: its base and head. A merge group: its base and its commit. A push: the commit before it and the one pushed.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: .github/tests-to-run.sh

  after-merge:
    name: After-merge check tests
    needs: changes
    if: ${{ needs.changes.outputs.after-merge == 'true' }}
    uses: ./.github/workflows/after-merge-tests.yml

  agent-skills-highlighter:
    name: Agent Skills Highlighter tests
    needs: changes
    if: ${{ needs.changes.outputs.agent-skills-highlighter == 'true' }}
    uses: ./.github/workflows/agent-skills-highlighter-tests.yml

  agent-stats:
    name: Agent Stats tests
    needs: changes
    if: ${{ needs.changes.outputs.agent-stats == 'true' }}
    uses: ./.github/workflows/agent-stats-tests.yml

  ai-sorter:
    name: AI sorter tests
    needs: changes
    if: ${{ needs.changes.outputs.ai-sorter == 'true' }}
    uses: ./.github/workflows/ai-sorter-tests.yml

  artifacts:
    name: Artifacts tests
    needs: changes
    if: ${{ needs.changes.outputs.artifacts == 'true' }}
    uses: ./.github/workflows/artifacts-tests.yml

  artifacts-browser:
    name: Artifacts browser tests
    needs: changes
    if: ${{ needs.changes.outputs.artifacts-browser == 'true' }}
    uses: ./.github/workflows/artifacts-browser-tests.yml

  beeper:
    name: Beeper tests
    needs: changes
    if: ${{ needs.changes.outputs.beeper == 'true' }}
    uses: ./.github/workflows/beeper-tests.yml

  linear:
    name: Linear tests
    needs: changes
    if: ${{ needs.changes.outputs.linear == 'true' }}
    uses: ./.github/workflows/linear-tests.yml

  megatech-support:
    name: Megatech support tests
    needs: changes
    if: ${{ needs.changes.outputs.megatech-support == 'true' }}
    uses: ./.github/workflows/megatech-support-tests.yml

  megatech-support-browser:
    name: Megatech support browser tests
    needs: changes
    if: ${{ needs.changes.outputs.megatech-support-browser == 'true' }}
    uses: ./.github/workflows/megatech-support-browser-tests.yml

  merge-by-policy:
    name: Merge-by-policy tests
    needs: changes
    if: ${{ needs.changes.outputs.merge-by-policy == 'true' }}
    uses: ./.github/workflows/merge-by-policy-tests.yml

  plugin-assets:
    name: Plugin assets check
    needs: changes
    if: ${{ needs.changes.outputs.plugin-assets == 'true' }}
    uses: ./.github/workflows/plugin-assets-tests.yml

  vim-tests:
    name: Vim functional tests
    needs: changes
    if: ${{ needs.changes.outputs.vim-tests == 'true' }}
    uses: ./.github/workflows/vim-tests.yml

  vim-latency:
    name: Vim key latency
    needs: changes
    if: ${{ needs.changes.outputs.vim-latency == 'true' }}
    uses: ./.github/workflows/vim-latency.yml

  all-tests:
    # The check to require. It runs whatever happened above (`always()`), and it has no `if` that could skip it, because a required
    # check that is skipped counts as passed. It fails unless:
    #   - `changes` passed;
    #   - the rows of .github/tests-to-run.sh, the outputs of `changes` and the jobs this one needs are the same names, so no row is
    #     left without a job and no job without a row;
    #   - each test workflow did what its row said: passed when it was called ("true"), was skipped when it was not ("false").
    name: all-tests
    needs: [changes, after-merge, agent-skills-highlighter, agent-stats, ai-sorter, artifacts, artifacts-browser, beeper, linear, megatech-support, megatech-support-browser, merge-by-policy, plugin-assets, vim-tests, vim-latency]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test that applies passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # One line per name: the name, what `changes` said, and how the job ended.
          table=$(jq -r '
            . as $n
            | (($n.changes.outputs.rows // "") | split(" ") | map(select(. != ""))) as $rows
            | ($rows + ($n | keys | map(select(. != "changes"))) + ($n.changes.outputs // {} | keys | map(select(. != "rows"))) | unique)[]
            | [., ($n.changes.outputs[.] // "(no output)"), ($n[.].result // "(no job)")] | @tsv' <<<"$NEEDS")
          {
            echo "### all-tests"
            echo
            echo "Which plugin tests apply: $(jq -r .changes.result <<<"$NEEDS")"
            echo
            echo "| Tests | Called | Result |"
            echo "| --- | --- | --- |"
            awk -F'\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }' <<<"$table"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Which plugin tests apply: $(jq -r .changes.result <<<"$NEEDS")"
          awk -F'\t' '{ printf "%s: called %s, %s\n", $1, $2, $3 }' <<<"$table"
          problems=$(jq -r '
            . as $n
            | (($n.changes.outputs.rows // "") | split(" ") | map(select(. != "")) | sort) as $rows
            | ($n | keys | map(select(. != "changes")) | sort) as $jobs
            | ($n.changes.outputs // {} | keys | map(select(. != "rows")) | sort) as $outputs
            | if $n.changes.result != "success" then "Working out which plugin tests apply failed: see the `changes` job\u0027s log."
              else
                (if $rows != $jobs then "the rows of .github/tests-to-run.sh (\($rows | join(", "))) are not the jobs all-tests needs (\($jobs | join(", ")))" else empty end),
                (if $outputs != $jobs then "the outputs of the changes job (\($outputs | join(", "))) are not the jobs all-tests needs (\($jobs | join(", ")))" else empty end),
                ($jobs[] as $j | ($n.changes.outputs[$j] // "") as $called | $n[$j].result as $result
                  | if $called == "true" and $result == "success" then empty
                    elif $called == "false" and $result == "skipped" then empty
                    else "\($j): called \(if $called == "" then "(no output)" else $called end), \($result)" end)
              end' <<<"$NEEDS")
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
          echo "Every test that applies passed."
