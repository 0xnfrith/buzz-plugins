# The tests of the Beeper plugin. The `test` job: the type check and the unit tests (plugins/beeper/test/unit): the curl request, the
# client against the real curl and a fake Beeper, the store, the formatting, and that the committed plugin.js is the build of src/. The
# `browser` job: the browser suite (plugins/beeper/test/web/beeper.spec.mjs: the list, a chat, sending, every problem state, the Settings
# card, the Keychain flows, light and dark, clean-up, the key budget) in headless Chromium against block/buzz-app's own production web
# build, the way plugins/beeper/test/run.sh runs it by hand. Neither needs a Beeper Desktop, a token or a Keychain: the browser suite
# runs the real curl against a fake Beeper Desktop on loopback, and a stand-in `security` keeps its "keychain" in a file.
name: Beeper tests

on:
  # Called by tests.yml, which runs on every pull request to main, every push to main and every merge group, and calls this
  # workflow when its plugin changes (or anything under .github/). Its `all-tests` check is the one to require. Run by hand from the
  # Actions tab with workflow_dispatch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The block/buzz-app commit the plugin is tested against. The other workflows that build the app name the same commit: the first step
  # of each of them (.github/check-app-ref.sh) fails when any two differ, or when one uses it without defining it, so change them together.
  BUZZ_APP_REF: d92bfb2c4dd89fc5ae6e7a1445f38ad1e8ab7060

jobs:
  test:
    name: Beeper type check, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/beeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc
      - name: Unit tests
        # A run that finds no tests passes too, so the machine-readable result says it: some tests ran, every one passed, none was skipped.
        run: |
          pnpm exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/unit.json"
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numFailedTests == 0 and .numPendingTests == 0' "$RUNNER_TEMP/unit.json"
          jq '{tests: .numTotalTests, passed: .numPassedTests, failed: .numFailedTests, skipped: .numPendingTests}' "$RUNNER_TEMP/unit.json"
      - name: plugin.js is the build of the source
        # Buzz loads the committed plugin.js and never runs a build: it has to be what this source builds to. The file is removed
        # first, so a build that does not write it (a changed output name, a build script that does nothing) leaves it missing, and
        # `git status` also catches a plugin.js that is missing from the commit, not tracked or ignored. The status is its own command,
        # so a git error fails the step.
        run: |
          rm -f plugin.js
          pnpm run build
          status=$(git status --porcelain --ignored -- plugin.js)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- plugin.js
            echo "::error::plugin.js is not the build of src/: run 'pnpm run build' in plugins/beeper and commit it"
            exit 1
          fi

  browser:
    name: Beeper browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # the suite takes about 3 minutes; the set-up is most of the rest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: BUZZ_APP_REF is defined, and the same, in every workflow that builds the app
        run: .github/check-app-ref.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: curl is on the runner (the suite runs the real one against the fake Beeper)
        run: curl --version
      # The plugin's own dependencies are not installed here: the spec, the fake Beeper and the host simulation use only Node's own
      # modules, and the plugin.js under test is the committed one (the `test` job checks it is the build of src/).
      - name: Browser tests
        run: plugins/beeper/test/run.sh buzz-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: beeper-browser-test-results
          path: buzz-app/test-results
          if-no-files-found: ignore
          retention-days: 14
