# Type check, unit tests and build check of the Linear plugin (plugins/linear/test/unit; the build check: the committed plugin.js is
# the build of src/), its key store against a real Secret Service, and its browser suite (plugins/linear/test/web/linear.spec.mjs) in
# headless Chromium against block/buzz-app's own production web build, the way plugins/linear/test/run.sh runs it by hand, with the
# stand-ins for `security` and `secret-tool` and a fake Linear (no keyring, key or token). plugins/linear/NOTES.md says what it covers.
name: Linear tests

on:
  # Called by tests.yml, which runs on every pull request to main, every push to main and every merge group, and calls this
  # workflow when its plugin changes (or anything under .github/). Its `all-tests` check is the one to require. Run by hand from the
  # Actions tab with workflow_dispatch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The block/buzz-app commit the plugin is tested against. The other workflows that build the app name the same commit: the first step
  # of each of them (.github/check-app-ref.sh) fails when any two differ, or when one uses it without defining it, so change them together.
  BUZZ_APP_REF: 51d63954c074e94497dc030b54a204d34b7471be

jobs:
  test:
    name: Linear type check, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/linear
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Linear's published schema (a pinned commit, hash checked)
        run: test/fake-linear/fetch-schema.sh
      - name: Type check
        run: pnpm exec tsc
      - name: Unit tests
        run: pnpm test
      - name: plugin.js is the build of the source
        # Buzz loads the committed plugin.js and never runs a build: it has to be what this source builds to. The file is removed
        # first, so a build that does not write it (a changed output name, a build script that does nothing) leaves it missing, and
        # `git status` also catches a plugin.js that is missing from the commit, not tracked or ignored. The status is its own command,
        # so a git error fails the step.
        run: |
          rm -f plugin.js
          pnpm run build
          status=$(git status --porcelain --ignored -- plugin.js)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- plugin.js
            echo "::error::plugin.js is not the build of src/: run 'pnpm run build' in plugins/linear and commit it"
            exit 1
          fi

  secret-service:
    # The Linux key store (plugins/linear/test/unit/secret-service.real.test.ts) with the real `secret-tool` and a real Secret
    # Service: gnome-keyring on a private session bus, started with a throwaway password so that it makes its keyring. The same
    # tests are skipped in the job above, where no keyring runs. The macOS Keychain has no runner here.
    name: Linear key store on a real Secret Service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/linear
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: A Secret Service and secret-tool
        # A stuck package mirror fails this step in 3 minutes, after apt's own retries, rather than holding the job for its 15.
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends dbus gnome-keyring libsecret-tools
      - name: The key store against the real secret-tool
        env:
          LINEAR_REAL_SECRET_TOOL: "1"
        run: |
          dbus-run-session -- bash -ec '
            eval "$(printf "ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            pnpm exec vitest run test/unit/secret-service.real.test.ts --reporter=json --outputFile="$RUNNER_TEMP/real.json"
          '
          # A skipped suite passes too, so the machine-readable result says it: some tests ran, every one passed, none was skipped.
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numFailedTests == 0 and .numPendingTests == 0' "$RUNNER_TEMP/real.json"
          jq '{tests: .numTotalTests, passed: .numPassedTests, failed: .numFailedTests, skipped: .numPendingTests}' "$RUNNER_TEMP/real.json"

  browser:
    # plugins/linear/test/web/linear.spec.mjs in headless Chromium against block/buzz-app's own production web build, at BUZZ_APP_REF.
    # test/run.sh fetches Linear's public schema (a pinned commit, hash checked), copies the built plugin and the spec into the app
    # checkout and runs the fake Linear behind the host's `request`. The key stores are the stand-ins for `security` and `secret-tool`
    # (test/fake-security, test/fake-secret-tool): no keyring runs, and no secret or token is used.
    name: Linear browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # the tests take a few minutes; the set-up is most of it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: BUZZ_APP_REF is defined, and the same, in every workflow that builds the app
        run: .github/check-app-ref.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.BUZZ_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: "Install the plugin's own dependencies (frozen lockfile; the fake Linear runs graphql-js)"
        run: corepack pnpm@12.16.1 --dir plugins/linear install --frozen-lockfile
      - name: Browser tests
        run: plugins/linear/test/run.sh buzz-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: linear-browser-test-results
          path: buzz-app/test-results
          if-no-files-found: ignore
          retention-days: 14
