# Type check, unit tests and build check of the Megatech support plugin (plugins/megatech-support/test/unit). The browser suite is a
# separate workflow (megatech-support-browser-tests.yml): it needs a block/buzz-app checkout.
name: Megatech support tests

on:
  # Called by tests.yml, which runs on every pull request to main, every push to main and every merge group, and calls this
  # workflow when its plugin changes (or anything under .github/). Its `all-tests` check is the one to require. Run by hand from the
  # Actions tab with workflow_dispatch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Megatech support type check, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/megatech-support
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc
      - name: Unit tests
        # A run that finds no tests passes too, so the machine-readable result says it: some tests ran, every one passed, none was skipped.
        run: |
          pnpm exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/unit.json"
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numFailedTests == 0 and .numPendingTests == 0' "$RUNNER_TEMP/unit.json"
          jq '{tests: .numTotalTests, passed: .numPassedTests, failed: .numFailedTests, skipped: .numPendingTests}' "$RUNNER_TEMP/unit.json"
      - name: plugin.js is the build of the source
        # Buzz loads the committed plugin.js and never runs a build: it has to be what this source builds to. The file is removed
        # first, so a build that does not write it (a changed output name, a build script that does nothing) leaves it missing, and
        # `git status` also catches a plugin.js that is missing from the commit, not tracked or ignored. The status is its own command,
        # so a git error fails the step.
        run: |
          rm -f plugin.js
          pnpm run build
          status=$(git status --porcelain --ignored -- plugin.js)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- plugin.js
            echo "::error::plugin.js is not the build of src/: run 'pnpm run build' in plugins/megatech-support and commit it"
            exit 1
          fi
