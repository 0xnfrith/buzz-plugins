# The tests of the Agent Stats plugin (plugins/agent-stats/test): the node tests (folding Buzz's agent telemetry into a day's tally, the
# store and its saving, the wiring against a made-up Buzz; no dependencies, no build) and the browser spec (the page, the plugin's own
# lease on the telemetry, the tally across a restart, text contrast in both themes, a narrow window) in headless Chromium against
# block/buzz-app's own production web build, the way plugins/agent-stats/test/run.sh runs it by hand.
name: Agent Stats tests

on:
  # Called by tests.yml, which runs on every pull request to main, every push to main and every merge group, and calls this
  # workflow when its plugin changes (or anything under .github/). Its `all-tests` check is the one to require. Run by hand from the
  # Actions tab with workflow_dispatch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The block/buzz-app commit the plugin is tested against. It is not the commit the other plugins' workflows name: the plugin needs
  # `ctx.agents.registerTab`, which block/buzz-app has only since 29 October 2026, and the shared commit is older. This one is its own
  # variable, so .github/check-app-ref.sh (which keeps the shared one the same everywhere) neither reads nor needs it. When the shared
  # commit moves past this one, this can join it. plugins/agent-stats/test/app-ref.test.mjs checks that it is a full commit and that the
  # plugin's NOTES.md names the same one.
  AGENT_STATS_APP_REF: 5a7f4952ff6af5dafe74faa8e95d85f0a15f37c2

jobs:
  unit:
    name: Agent Stats unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test plugins/agent-stats/test/*.test.mjs

  browser:
    name: Agent Stats browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: block/buzz-app
          ref: ${{ env.AGENT_STATS_APP_REF }}
          path: buzz-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm, as the app pins it
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./buzz-app/package.json').packageManager")" --activate
      - name: Install the app's dependencies (frozen lockfile)
        working-directory: buzz-app
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: buzz-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: plugins/agent-stats/test/run.sh buzz-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: agent-stats-test-results
          path: buzz-app/test-results
          if-no-files-found: ignore
          retention-days: 14
