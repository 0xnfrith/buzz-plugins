# Tests of the AI sorter (.github/sorter/sorter.test.ts), against a fake Claude API, a fake GitHub API and real git repositories on the
# runner: no key, and no network beyond the install.
name: AI sorter tests

on:
  # Called by tests.yml, which runs on every pull request into main and every push to main, and calls this workflow when anything
  # under .github/ changes (the `ai-sorter` row of .github/tests-to-run.sh). Its `all-tests` check is the one to require.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: AI sorter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/sorter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # One exact build of Bun, downloaded, never restored from the Actions cache (ai-sorter.yml says why).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          no-cache: true
      - name: Bun is the pinned build
        working-directory: .
        env:
          BUN_SHA256: 10702245766b225e70bbf6235fd6b47214fd94b4760d00ffaed8ab0df57ac235
        run: echo "$BUN_SHA256  $(command -v bun)" | sha256sum --check --strict
      - name: Install (frozen lockfile, no install scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Tests
        # Lets the tests point the sorter at their own list, always.txt and fake Claude API. The check's workflow never sets it.
        env:
          SORTER_TEST: "1"
        run: bun test
