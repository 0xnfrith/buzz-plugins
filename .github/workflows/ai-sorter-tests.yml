# Tests of the AI sorter (.github/sorter/sorter.test.ts), against a fake Claude API, a fake GitHub API and real git repositories on the
# runner: no key, and no network beyond the install.
name: AI sorter tests

on:
  # Called by tests.yml, which runs on every pull request and every push to main and calls this workflow when a file it tests
  # changes. Its `all-tests` check is the one to require.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: AI sorter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/sorter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install (frozen lockfile, no install scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Tests
        run: bun test
